# windows11-inventory.ini
# Inventory file for Windows 11 VM for offensive tools installation

[windows11]
# Replace with your Windows 11 VM IP address
windows11_vm ansible_host=192.168.1.100

[windows11:vars]
# Windows connection settings
ansible_user=Administrator
ansible_password=YourStrongPassword123!
ansible_connection=winrm
ansible_port=5986
ansible_winrm_scheme=https
ansible_winrm_transport=credssp
ansible_winrm_server_cert_validation=ignore

# Chocolatey settings
chocolatey_install_path=C:\ProgramData\chocolatey
chocolatey_temp_dir=C:\Windows\Temp\chocolatey

# Mandiant repository
mandiant_repo_url=https://www.myget.org/F/vm-packages/api/v2
mandiant_repo_name=mandiant-vm-packages

# Performance settings for large installations
ansible_winrm_operation_timeout_sec=3600
ansible_winrm_read_timeout_sec=3600
ansible_winrm_kerberos_delegation=true

# Additional Windows 11 specific settings
windows11_edition=Windows 11 Pro
windows11_build=22H2
windows11_architecture=x64

# Network configuration
ansible_winrm_message_encryption=auto
ansible_winrm_ca_trust_path=/etc/ansible/certs/ca.pem

# Chocolatey proxy settings (uncomment if needed)
# chocolatey_proxy=http://your-proxy:8080
# chocolatey_proxy_username=your_username
# chocolatey_proxy_password=your_password